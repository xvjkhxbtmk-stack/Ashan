name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)
          test -n "$ZIP" || { echo "ZIP file not found"; exit 1; }
          unzip -o "$ZIP" -d project

      - name: Find Gradle project
        run: |
          G=$(find project -type f -name gradlew | head -1)
          test -n "$G" || { echo "gradlew not found in ZIP"; exit 1; }
          chmod +x "$G"
          echo "GRADLEW=$G" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            project/**/build/outputs/apk/**/*.apk
