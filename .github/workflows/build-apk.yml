name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o "$(find . -maxdepth 1 -name '*.zip' | head -1)" -d project

      - name: Build
        run: |
          G=$(find project -name gradlew | head -1)
          test -n "$G"
          chmod +x "$G"
          cd "$(dirname "$G")"
          ./gradlew assembleDebug --no-daemon

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: Archana-AI-APK
          path: project/**/build/outputs/apk/**/*.apk
